# -----------------------------------------------------------------------------
# Project : Origin Observer
# File    : Cargo.toml
# Purpose : Define the Rust workspace and shared package metadata.
# Author  : İrfan Gedik
# Year    : 2026
# -----------------------------------------------------------------------------

[workspace]
resolver = "2"
members = [
  "crates/oo-abi",
  "crates/oo-bytecode",
  "crates/oo-cache",
  "crates/oo-cli",
  "crates/oo-confidence",
  "crates/oo-config",
  "crates/oo-core",
  "crates/oo-dataset",
  "crates/oo-descriptor",
  "crates/oo-discovery",
  "crates/oo-evidence",
  "crates/oo-experiment",
  "crates/oo-history",
  "crates/oo-model",
  "crates/oo-observer",
  "crates/oo-provider",
  "crates/oo-proxy",
  "crates/oo-report",
  "crates/oo-rpc",
  "crates/oo-snapshot",
  "crates/oo-storage",
  "crates/oo-test-support",
  "crates/oo-utils",
  "crates/oo-wallet",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["İrfan Gedik"]
license-file = "LICENSE.md"
repository = "https://github.com/OWNER/origin-observer"
homepage = "https://github.com/OWNER/origin-observer"
documentation = "https://github.com/OWNER/origin-observer/tree/main/docs"
readme = "README.md"
keywords = ["blockchain", "wallet", "discovery", "research", "evidence"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
once_cell = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = "allow"
nursery = "allow"
cargo = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
assertions_on_constants = "allow"
double_must_use = "allow"
wrong_self_convention = "allow"
